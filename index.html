<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flower for Pink 🌷</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle, #1a0817 0%, #050005 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            color: #fff;
        }

        .container {
            text-align: center;
            position: relative;
            width: 100%;
            max-width: 600px;
            padding: 20px;
        }

        /* --- 3D Gift Box Screen --- */
        .gift-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .gift-box {
            position: relative;
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #d63384, #e60073);
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(230, 0, 115, 0.4), 0 0 20px rgba(255, 105, 180, 0.2);
            animation: float 3s ease-in-out infinite;
            transform-style: preserve-3d;
        }

        .gift-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 45px;
            width: 30px;
            height: 100%;
            background: #ffd700;
        }

        .gift-box::after {
            content: '';
            position: absolute;
            top: 45px;
            left: 0;
            width: 100%;
            height: 30px;
            background: #ffd700;
        }

        .ribbon-bow {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 30px;
            background: #ffd700;
            border-radius: 50% 50% 0 0;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .tap-hint {
            margin-top: 30px;
            font-size: 1.1rem;
            letter-spacing: 2px;
            color: #ff99dd;
            animation: pulse 1.5s infinite;
        }

        /* --- Flower Reveal Screen --- */
        .flower-screen {
            display: none;
            opacity: 0;
            flex-direction: column;
            align-items: center;
            transition: opacity 1s ease;
        }

        .title {
            font-size: 2.5rem;
            color: #ff4d94;
            text-shadow: 0 0 15px rgba(255, 77, 148, 0.6), 0 0 25px rgba(255, 255, 255, 0.4);
            margin-bottom: 30px;
            letter-spacing: 3px;
        }

        /* 3D Animated Rose / Flower */
        .rose-container {
            position: relative;
            width: 150px;
            height: 250px;
            animation: float 4s ease-in-out infinite;
        }

        .rose-flower {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 80px;
        }

        .petal {
            position: absolute;
            width: 50px;
            height: 50px;
            background: radial-gradient(circle, #ff0055 0%, #990033 100%);
            border-radius: 50% 50% 50% 0;
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.5);
        }

        .petal:nth-child(1) { transform: rotate(0deg) translate(10px, 10px); }
        .petal:nth-child(2) { transform: rotate(72deg) translate(10px, 10px); }
        .petal:nth-child(3) { transform: rotate(144deg) translate(10px, 10px); }
        .petal:nth-child(4) { transform: rotate(216deg) translate(10px, 10px); }
        .petal:nth-child(5) { transform: rotate(288deg) translate(10px, 10px); }

        .rose-center {
            position: absolute;
            top: 25px;
            left: 25px;
            width: 30px;
            height: 30px;
            background: radial-gradient(circle, #ff6699 0%, #cc0044 100%);
            border-radius: 50%;
            z-index: 2;
        }

        .stem {
            position: absolute;
            top: 90px;
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 140px;
            background: linear-gradient(to bottom, #2e8b57, #1e5631);
            border-radius: 4px;
        }

        .leaf {
            position: absolute;
            width: 35px;
            height: 20px;
            background: #2e8b57;
            border-radius: 20px 0 20px 0;
        }

        .leaf.left {
            top: 130px;
            left: 30px;
            transform: rotate(-25deg);
        }

        .leaf.right {
            top: 150px;
            right: 30px;
            transform: rotate(25deg) scaleX(-1);
        }

        /* Sparkles */
        .sparkle-container {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .sparkle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px #ff66cc, 0 0 20px #ff66cc;
            animation: blink 2s infinite ease-in-out;
        }

        /* Animations */
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(2deg); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        @keyframes blink {
            0%, 100% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- หน้ากล่องของขวัญ -->
        <div class="gift-screen" id="giftScreen" onclick="openGift()">
            <div class="gift-box">
                <div class="ribbon-bow"></div>
            </div>
            <div class="tap-hint">TAP TO OPEN GIFT 🎁</div>
        </div>

        <!-- หน้าดอกไม้ -->
        <div class="flower-screen" id="flowerScreen">
            <h1 class="title">FLOWER FOR PINK 🌷</h1>
            
            <div class="rose-container">
                <div class="sparkle-container">
                    <div class="sparkle" style="top: 10%; left: 20%; animation-delay: 0s;"></div>
                    <div class="sparkle" style="top: 30%; left: 80%; animation-delay: 0.5s;"></div>
                    <div class="sparkle" style="top: 70%; left: 15%; animation-delay: 1s;"></div>
                    <div class="sparkle" style="top: 85%; left: 75%; animation-delay: 1.5s;"></div>
                </div>

                <div class="rose-flower">
                    <div class="petal"></div>
                    <div class="petal"></div>
                    <div class="petal"></div>
                    <div class="petal"></div>
                    <div class="petal"></div>
                    <div class="rose-center"></div>
                </div>
                <div class="stem"></div>
                <div class="leaf left"></div>
                <div class="leaf right"></div>
            </div>
        </div>
    </div>

    <script>
        function openGift() {
            const giftScreen = document.getElementById('giftScreen');
            const flowerScreen = document.getElementById('flowerScreen');

            giftScreen.style.opacity = '0';
            giftScreen.style.transform = 'scale(0.8)';
            
            setTimeout(() => {
                giftScreen.style.display = 'none';
                flowerScreen.style.display = 'flex';
                setTimeout(() => {
                    flowerScreen.style.opacity = '1';
                }, 50);
            }, 800);
        }
    </script>
</body>
</html>
